<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Aberto 3D - Primeira e Segunda Pessoa</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px 18px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
      font-size: 14px;
      border-left: 4px solid #00aaff;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    #controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #ddd;
      padding: 12px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid #444;
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }
    #controls span {
      color: #88ddff;
      font-weight: bold;
    }
    #toggle-view {
      position: absolute;
      bottom: 100px;
      right: 30px;
      background: #1e2a3a;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      border: 1px solid #4a6a8a;
      z-index: 20;
      letter-spacing: 0.5px;
    }
    #toggle-view:hover {
      background: #2a3e5a;
      transform: scale(1.03);
      border-color: #8ab3ff;
    }
    #car-status {
      position: absolute;
      bottom: 120px;
      left: 30px;
      color: #aaddff;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #2a6a8a;
      backdrop-filter: blur(2px);
      pointer-events: none;
      z-index: 10;
    }
    @media (max-width: 600px) {
      #controls { font-size: 11px; padding: 8px 12px; bottom: 15px; width: 90%; white-space: normal; }
      #info { font-size: 12px; padding: 6px 12px; }
      #toggle-view { padding: 10px 16px; font-size: 14px; bottom: 80px; right: 15px; }
    }
  </style>
</head>
<body>
  <div id="info">🚗 Mundo Aberto • WASD mover • Espaço pular</div>
  <div id="car-status">🚶 A pé</div>
  <div id="controls"><span>W</span> <span>A</span> <span>S</span> <span>D</span> • <span>Espaço</span> pular • <span>E</span> entrar/sair carro</div>
  <button id="toggle-view">🔁 Visão 2ª pessoa</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Cena, câmera, renderers ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 80, 250);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 3, 8);

    const renderer = new THREE.WebGLRenderer({ antialiasing: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.bias = 0.0001;
    document.body.appendChild(renderer.domElement);

    // --- Iluminação ---
    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 120;
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8899ff, 0.3);
    fill.position.set(-30, 10, -30);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffccaa, 0.2);
    rim.position.set(-10, 20, 30);
    scene.add(rim);

    // --- Chão ---
    const groundGeometry = new THREE.PlaneGeometry(400, 400);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x3a4a5a,
      roughness: 0.9,
      metalness: 0.0,
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grade de ruas
    const gridHelper = new THREE.GridHelper(400, 40, 0x8899aa, 0x445566);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // --- Cidade ---
    function createBuilding(x, z, w, d, h, color) {
      const geometry = new THREE.BoxGeometry(w, h, d);
      const material = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.5,
        metalness: 0.1,
      });
      const building = new THREE.Mesh(geometry, material);
      building.position.set(x, h/2, z);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);

      // Janelas
      const windowMat = new THREE.MeshStandardMaterial({ 
        color: 0x88ccff, 
        emissive: new THREE.Color(0x224466), 
        emissiveIntensity: 0.2 
      });
      if (w > 2 && d > 2 && h > 3) {
        const countX = Math.min(Math.floor(w / 1.8), 4);
        const countZ = Math.min(Math.floor(d / 1.8), 4);
        const countY = Math.min(Math.floor(h / 2.5), 5);
        for (let i = 0; i < countX; i++) {
          for (let j = 0; j < countZ; j++) {
            for (let k = 0; k < countY; k++) {
              const win = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.05), windowMat);
              const offsetX = (i / (countX-1 || 1) - 0.5) * (w - 0.8);
              const offsetZ = (j / (countZ-1 || 1) - 0.5) * (d - 0.8);
              const offsetY = (k / (countY-1 || 1) - 0.5) * (h - 1.2) + 0.5;
              if (i % 2 === 0) {
                win.position.set(x + w/2 + 0.05, offsetY + 0.5, z + offsetZ);
                scene.add(win);
              } else {
                win.position.set(x - w/2 - 0.05, offsetY + 0.5, z + offsetZ);
                scene.add(win);
              }
            }
          }
        }
      }
    }

    const colors = [0x6a8c9a, 0x8a7a6a, 0x9a8a7a, 0x7a8a7a, 0x5a6a7a, 0x9a7a6a, 0x7a8a9a, 0x8a9a7a];
    for (let i = -8; i <= 8; i++) {
      for (let j = -8; j <= 8; j++) {
        if (Math.abs(i) <= 1 && Math.abs(j) <= 1) continue;
        if (Math.random() > 0.2) {
          const w = 2 + Math.random() * 3.5;
          const d = 2 + Math.random() * 3.5;
          const h = 2 + Math.random() * 10;
          const color = colors[Math.floor(Math.random() * colors.length)];
          const x = i * 9 + (Math.random() - 0.5) * 1.5;
          const z = j * 9 + (Math.random() - 0.5) * 1.5;
          createBuilding(x, z, w, d, h, color);
        }
      }
    }

    // Prédios altos
    for (let k = 0; k < 30; k++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 20 + Math.random() * 25;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const h = 12 + Math.random() * 18;
      createBuilding(x, z, 3.5, 3.5, h, 0x8a9a8a);
    }

    // --- Carro jogável ---
    const carGroup = new THREE.Group();
    // Corpo
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3, metalness: 0.6 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 1.3), bodyMat);
    body.position.y = 0.25;
    body.castShadow = true;
    carGroup.add(body);
    
    const cabinaMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.2, metalness: 0.1 });
    const cabina = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 1.2), cabinaMat);
    cabina.position.set(0, 0.65, 0);
    cabina.castShadow = true;
    carGroup.add(cabina);
    
    // Faróis
    const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffaa44, emissiveIntensity: 0.5 });
    const farol1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), lightMat);
    farol1.position.set(0.6, 0.25, -0.7);
    carGroup.add(farol1);
    const farol2 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), lightMat);
    farol2.position.set(-0.6, 0.25, -0.7);
    carGroup.add(farol2);
    
    // Rodas
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
    const wheelPos = [[-0.8, 0.1, -0.7], [0.8, 0.1, -0.7], [-0.8, 0.1, 0.7], [0.8, 0.1, 0.7]];
    wheelPos.forEach(pos => {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.15, 8), wheelMat);
      wheel.rotation.z = Math.PI/2;
      wheel.position.set(pos[0], pos[1], pos[2]);
      wheel.castShadow = true;
      carGroup.add(wheel);
    });
    carGroup.position.set(6, 0.3, 8);
    carGroup.rotation.y = 0.3;
    scene.add(carGroup);

    // Carros estacionados
    for (let i = 0; i < 25; i++) {
      const x = (Math.random() - 0.5) * 100;
      const z = (Math.random() - 0.5) * 100;
      if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
      const c = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 1), 
        new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.5 }));
      c.position.set(x, 0.2, z);
      c.rotation.y = Math.random() * Math.PI * 2;
      c.castShadow = true;
      c.receiveShadow = true;
      scene.add(c);
    }

    // --- Personagem humanoide ---
    const playerGroup = new THREE.Group();
    
    // Corpo
    const torsoMat = new THREE.MeshStandardMaterial({ color: 0x3a7abd, roughness: 0.6 });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.4), torsoMat);
    torso.position.y = 0.9;
    torso.castShadow = true;
    playerGroup.add(torso);
    
    // Cabeça
    const headMat = new THREE.MeshStandardMaterial({ color: 0xf0d8b0, roughness: 0.4 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), headMat);
    head.position.y = 1.5;
    head.castShadow = true;
    playerGroup.add(head);
    
    // Olhos
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat);
    eye1.position.set(0.15, 1.55, -0.2);
    playerGroup.add(eye1);
    const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat);
    eye2.position.set(-0.15, 1.55, -0.2);
    playerGroup.add(eye2);
    
    // Pernas
    const legMat = new THREE.MeshStandardMaterial({ color: 0x2a4a7a, roughness: 0.7 });
    const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), legMat);
    leg1.position.set(0.2, 0.25, 0);
    leg1.castShadow = true;
    playerGroup.add(leg1);
    const leg2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), legMat);
    leg2.position.set(-0.2, 0.25, 0);
    leg2.castShadow = true;
    playerGroup.add(leg2);
    
    // Braços
    const armMat = new THREE.MeshStandardMaterial({ color: 0xf0d8b0, roughness: 0.5 });
    const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), armMat);
    arm1.position.set(0.45, 0.9, 0);
    arm1.castShadow = true;
    playerGroup.add(arm1);
    const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), armMat);
    arm2.position.set(-0.45, 0.9, 0);
    arm2.castShadow = true;
    playerGroup.add(arm2);
    
    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    // --- Variáveis ---
    const keys = { w: false, a: false, s: false, d: false, space: false };
    let velocityY = 0;
    let isOnGround = true;
    let isSecondPerson = false;
    let inCar = false;
    const gravity = -30;
    const jumpSpeed = 10;
    const walkSpeed = 7;
    const carSpeed = 14;
    const mouseSensitivity = 0.002;

    let currentCar = carGroup;
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxDistance = 25;
    controls.minDistance = 2;
    controls.target.set(0, 1.2, 0);
    controls.enablePan = false;
    controls.update();

    // Controle de rotação da câmera em primeira pessoa
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
    let pitch = 0;
    let yaw = 0;

    // Mouse lock para primeira pessoa
    let isPointerLocked = false;

    renderer.domElement.addEventListener('click', () => {
      if (!isSecondPerson && !isPointerLocked) {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = document.pointerLockElement === renderer.domElement;
    });

    document.addEventListener('mousemove', (event) => {
      if (!isPointerLocked || isSecondPerson || inCar) return;
      
      const movementX = event.movementX || 0;
      const movementY = event.movementY || 0;
      
      yaw -= movementX * mouseSensitivity;
      pitch -= movementY * mouseSensitivity;
      pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
      
      euler.set(pitch, yaw, 0, 'YXZ');
      camera.quaternion.setFromEuler(euler);
    });

    // --- UI ---
    const toggleBtn = document.getElementById('toggle-view');
    const carStatus = document.getElementById('car-status');

    toggleBtn.addEventListener('click', () => {
      isSecondPerson = !isSecondPerson;
      toggleBtn.textContent = isSecondPerson ? '🔁 Visão 1ª pessoa' : '🔁 Visão 2ª pessoa';
      controls.enabled = isSecondPerson;
      
      if (isSecondPerson) {
        if (document.pointerLockElement) {
          document.exitPointerLock();
        }
        controls.target.copy(inCar ? currentCar.position : playerGroup.position);
        controls.update();
      } else {
        const target = inCar ? currentCar.position : playerGroup.position;
        const offset = inCar ? new THREE.Vector3(0, 1.5, 3.5) : new THREE.Vector3(0, 1.8, 3.5);
        const pos = target.clone().add(offset);
        camera.position.copy(pos);
        controls.target.copy(target);
        
        // Resetar rotação da câmera
        yaw = 0;
        pitch = 0;
        euler.set(0, 0, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);
        
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'e' || e.key === 'E') {
        if (!inCar) {
          const dist = playerGroup.position.distanceTo(currentCar.position);
          if (dist < 4) {
            inCar = true;
            carStatus.textContent = '🚗 Dirigindo';
            playerGroup.visible = false;
            if (isPointerLocked) {
              document.exitPointerLock();
              isPointerLocked = false;
            }
            if (!isSecondPerson) {
              camera.position.set(currentCar.position.x, currentCar.position.y + 1.5, currentCar.position.z + 3.5);
              controls.target.copy(currentCar.position);
            }
          }
        } else {
          inCar = false;
          carStatus.textContent = '🚶 A pé';
          playerGroup.visible = true;
          const pos = currentCar.position.clone().add(new THREE.Vector3(0, 0.6, 2));
          playerGroup.position.copy(pos);
          if (!isSecondPerson) {
            camera.position.set(pos.x, pos.y + 1.8, pos.z + 3.5);
            controls.target.copy(pos);
            renderer.domElement.requestPointerLock();
          }
        }
        return;
      }
      
      switch(e.code) {
        case 'KeyW': keys.w = true; e.preventDefault(); break;
        case 'KeyA': keys.a = true; e.preventDefault(); break;
        case 'KeyS': keys.s = true; e.preventDefault(); break;
        case 'KeyD': keys.d = true; e.preventDefault(); break;
        case 'Space': keys.space = true; e.preventDefault(); break;
      }
    });
    
    document.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': keys.w = false; e.preventDefault(); break;
        case 'KeyA': keys.a = false; e.preventDefault(); break;
        case 'KeyS': keys.s = false; e.preventDefault(); break;
        case 'KeyD': keys.d = false; e.preventDefault(); break;
        case 'Space': keys.space = false; e.preventDefault(); break;
      }
    });

    // Previne scroll com espaço
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') e.preventDefault();
    }, false);

    // --- Loop principal ---
    let clock = new THREE.Clock();

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);

      if (!inCar) {
        // Movimento a pé - baseado na direção da câmera
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(camera.quaternion);
        forward.y = 0;
        forward.normalize();
        
        const right = new THREE.Vector3(1, 0, 0);
        right.applyQuaternion(camera.quaternion);
        right.y = 0;
        right.normalize();
        
        const move = new THREE.Vector3(0, 0, 0);
        if (keys.w) move.add(forward);
        if (keys.s) move.sub(forward);
        if (keys.a) move.sub(right);
        if (keys.d) move.add(right);
        
        if (move.length() > 0) {
          move.normalize().multiplyScalar(walkSpeed * delta);
          playerGroup.position.add(move);
          
          // Rotacionar o personagem na direção do movimento
          const angle = Math.atan2(move.x, move.z);
          playerGroup.rotation.y = angle;
        }

        // Pulo
        if (keys.space && isOnGround) {
          velocityY = jumpSpeed;
          isOnGround = false;
        }

        // Gravidade
        velocityY += gravity * delta;
        playerGroup.position.y += velocityY * delta;
        if (playerGroup.position.y <= 0) {
          playerGroup.position.y = 0;
          velocityY = 0;
          isOnGround = true;
        }

        // Atualiza câmera em primeira pessoa
        if (!isSecondPerson) {
          const offset = new THREE.Vector3(0, 1.6, 0);
          camera.position.copy(playerGroup.position.clone().add(offset));
          controls.target.copy(playerGroup.position);
        } else {
          controls.target.copy(playerGroup.position);
        }

      } else {
        // Dirigindo carro
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentCar.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentCar.quaternion);
        const move = new THREE.Vector3(0, 0, 0);
        if (keys.w) move.add(forward);
        if (keys.s) move.sub(forward);
        if (keys.a) move.sub(right);
        if (keys.d) move.add(right);
        
        if (move.length() > 0) {
          move.normalize().multiplyScalar(carSpeed * delta);
          currentCar.position.add(move);
          if (keys.a || keys.d) {
            const rotSpeed = 3.0 * delta;
            if (keys.a) currentCar.rotation.y += rotSpeed;
            if (keys.d) currentCar.rotation.y -= rotSpeed;
          }
        }

        if (!isSecondPerson) {
          const offset = new THREE.Vector3(0, 1.5, 3.5);
          camera.position.copy(currentCar.position.clone().add(offset));
          controls.target.copy(currentCar.position);
        } else {
          controls.target.copy(currentCar.position);
        }
      }

      if (isSecondPerson) {
        controls.update();
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    controls.target.copy(playerGroup.position);
    controls.update();
    console.log('Jogo iniciado! WASD, Espaço, E para entrar/sair carro.');
  </script>
</body>
</html>
