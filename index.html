<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neymar Jr. - Futebol de Zoação Profissional</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a2f1f 0%, #1b4d2e 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            background: #1e3b2b;
            border-radius: 48px 48px 32px 32px;
            padding: 24px 24px 32px;
            box-shadow: 0 30px 30px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 255, 255, 0.2);
            border: 2px solid #c9a83b;
        }

        .field {
            position: relative;
            background: #2a7a3b;
            background-image: 
                radial-gradient(circle at 20% 40%, #3d9e4d 0%, transparent 30%),
                radial-gradient(circle at 90% 70%, #3d9e4d 0%, transparent 40%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 40px, transparent 40px, transparent 80px);
            width: 800px;
            height: 500px;
            border-radius: 24px;
            border: 6px solid #f0e6d2;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 0 0 4px #2d5a2d;
            overflow: hidden;
            cursor: crosshair;
        }

        .field::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.7);
            transform: translateY(-50%);
        }

        .field::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90px;
            height: 90px;
            border: 3px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .area {
            position: absolute;
            width: 120px;
            height: 220px;
            border: 3px solid rgba(255,255,255,0.7);
            top: 50%;
            transform: translateY(-50%);
        }

        .area-left {
            left: -6px;
            border-right: none;
            border-radius: 0 120px 120px 0;
        }

        .area-right {
            right: -6px;
            border-left: none;
            border-radius: 120px 0 0 120px;
        }

        .goalkeeper {
            position: absolute;
            width: 12px;
            height: 50px;
            background: #f1c40f;
            border-radius: 6px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 10px #f1c40f;
        }

        .goalkeeper-left { left: 20px; }
        .goalkeeper-right { right: 20px; }

        .player {
            position: absolute;
            width: 50px;
            height: 70px;
            border-radius: 12px 12px 8px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.8);
            box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.5);
            transition: transform 0.08s ease, filter 0.3s;
            z-index: 10;
            font-size: 11px;
            line-height: 1;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .player span {
            font-size: 22px;
            margin-bottom: 2px;
        }

        #neymar {
            background: #f7d117;
            color: #1e3b2b;
            text-shadow: none;
            border-color: #fff3b0;
        }

        #raphinha {
            background: #1e5aa7;
            color: white;
            border-color: #8bb9ff;
        }

        .ball {
            position: absolute;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 35% 35%, #fff, #bbb);
            border-radius: 50%;
            box-shadow: 0 6px 0 #6b6b6b, 0 8px 12px black;
            z-index: 20;
            border: 2px solid #333;
            transition: transform 0.05s linear;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            gap: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 4px black;
        }

        .status-item {
            background: #0f281b;
            padding: 8px 18px;
            border-radius: 30px;
            border: 2px solid #c9a83b;
            box-shadow: inset 0 2px 6px black;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .status-item span {
            color: #f7d117;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background: #c9a83b;
            border: none;
            border-radius: 40px;
            padding: 12px 26px;
            font-weight: 800;
            font-size: 1rem;
            color: #1e2b1e;
            box-shadow: 0 6px 0 #7a6220, 0 8px 12px black;
            cursor: pointer;
            transition: all 0.08s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #ffe28c;
            font-family: inherit;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 1px 0 #7a6220, 0 5px 10px black;
        }

        button:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a6220;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .message-box {
            background: #0f1f15;
            border-radius: 40px;
            padding: 14px 24px;
            margin-top: 18px;
            color: #f0e6d2;
            font-weight: 600;
            text-align: center;
            border-left: 8px solid #f7d117;
            box-shadow: inset 0 0 12px black;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .fragile-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: #e63946;
            color: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 0.75rem;
            border: 3px solid #ffb3b3;
            box-shadow: 0 6px 0 #8b1e1e;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            z-index: 30;
            pointer-events: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.05); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .oil-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 30% 40%, rgba(255,255,200,0.2) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(200,255,200,0.2) 0%, transparent 60%);
            z-index: 5;
            mix-blend-mode: overlay;
            border-radius: 18px;
        }

        .key-hint {
            display: inline-block;
            background: #0f1f15;
            border: 2px solid #c9a83b;
            border-radius: 8px;
            padding: 2px 8px;
            margin: 0 3px;
            font-weight: 900;
            color: #f7d117;
            font-size: 0.85rem;
            box-shadow: 0 2px 0 #7a6220;
        }

        .small-hint {
            font-size: 0.8rem;
            color: #c0c0a0;
            margin-top: 10px;
            text-align: center;
        }

        /* Botões virtuais de controle (opcional, para touch) */
        .dpad-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 4px;
        }

        .dpad button {
            padding: 0;
            border-radius: 12px;
            font-size: 1.4rem;
            box-shadow: 0 4px 0 #7a6220, 0 5px 8px black;
            border: 2px solid #ffe28c;
            background: #c9a83b;
        }

        .dpad button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7a6220;
        }

        .dpad .empty {
            background: transparent;
            box-shadow: none;
            border: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="field" id="field">
            <div class="area area-left"></div>
            <div class="area area-right"></div>
            <div class="goalkeeper goalkeeper-left"></div>
            <div class="goalkeeper goalkeeper-right"></div>

            <div class="player" id="neymar" style="left: 100px; top: 220px;">
                <span>⚽</span> NEYMAR
            </div>

            <div class="player" id="raphinha" style="left: 650px; top: 220px;">
                <span>✨</span> RAPHINHA
            </div>

            <div class="ball" id="ball" style="left: 120px; top: 240px;"></div>

            <div class="oil-effect"></div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                🎮 <span id="score-display">GOLS: 0</span>
            </div>
            <div class="status-item">
                🩼 <span id="injury-display">LESÕES: 0</span>
            </div>
            <div class="status-item">
                🧴 <span id="oil-display">ÓLEO: 0</span>
            </div>
        </div>

        <div class="message-box" id="message">
            Mova o Neymar com <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> e chute com <span class="key-hint">ESPAÇO</span>!
        </div>

        <!-- D-pad opcional (útil para mobile) -->
        <div class="dpad-container">
            <div class="dpad">
                <button class="empty"></button>
                <button data-key="w">▲</button>
                <button class="empty"></button>
                <button data-key="a">◀</button>
                <button class="empty"></button>
                <button data-key="d">▶</button>
                <button class="empty"></button>
                <button data-key="s">▼</button>
                <button class="empty"></button>
            </div>
        </div>

        <div class="controls">
            <button id="shoot-btn">⚡ CHUTAR (ESPAÇO)</button>
            <button id="walker-btn" disabled>🦯 ANDADOR (0)</button>
            <button id="reset-btn">🔄 REINICIAR</button>
        </div>
        <div class="small-hint">* Use W A S D para andar ou as setas. Chute com ESPAÇO. Cuidado: Neymar é frágil!</div>
    </div>

    <script>
        (function() {
            // ===== ELEMENTOS =====
            const field = document.getElementById('field');
            const neymar = document.getElementById('neymar');
            const raphinha = document.getElementById('raphinha');
            const ball = document.getElementById('ball');
            const messageEl = document.getElementById('message');
            const scoreSpan = document.getElementById('score-display');
            const injurySpan = document.getElementById('injury-display');
            const oilSpan = document.getElementById('oil-display');
            const walkerBtn = document.getElementById('walker-btn');
            const resetBtn = document.getElementById('reset-btn');
            const shootBtn = document.getElementById('shoot-btn');

            // ===== CONSTANTES =====
            const FIELD_W = 800, FIELD_H = 500;
            const PLAYER_W = 50, PLAYER_H = 70;
            const BALL_SIZE = 28;

            // ===== ESTADO =====
            let neymarPos = { x: 100, y: 220 };
            let raphinhaPos = { x: 650, y: 220 };
            let ballPos = { x: 120, y: 240 };
            let ballVelocity = { x: 0, y: 0 };

            let score = 0;
            let injuries = 0;
            let oilCount = 0;
            let neymarInjured = false;
            let usingWalker = false;
            let walkerAvailable = false;

            // Estado das teclas — usa tanto WASD quanto setas
            const keys = {
                up: false,
                down: false,
                left: false,
                right: false,
                space: false
            };

            let lastTimestamp = 0;
            let ballMoving = false;
            let goalCooldown = false;
            let fragileBadge = null;
            let shootCooldown = false; // evita chutes repetidos muito rápidos

            // ===== UTILITÁRIOS =====
            function clamp(value, min, max) {
                return Math.min(max, Math.max(min, value));
            }

            function updatePositions() {
                neymar.style.left = neymarPos.x + 'px';
                neymar.style.top = neymarPos.y + 'px';
                raphinha.style.left = raphinhaPos.x + 'px';
                raphinha.style.top = raphinhaPos.y + 'px';
                ball.style.left = ballPos.x + 'px';
                ball.style.top = ballPos.y + 'px';
            }

            function updateStatus() {
                scoreSpan.textContent = `GOLS: ${score}`;
                injurySpan.textContent = `LESÕES: ${injuries}`;
                oilSpan.textContent = `ÓLEO: ${oilCount}`;
                walkerBtn.textContent = walkerAvailable ? '🦯 ANDADOR (ATIVAR)' : '🦯 ANDADOR (0)';
                walkerBtn.disabled = !walkerAvailable || usingWalker;
                // Botão de chute: desabilitado se lesionado sem andador
                shootBtn.disabled = (neymarInjured && !usingWalker);
            }

            function setMessage(text, isWarning = false) {
                messageEl.innerHTML = text;
                messageEl.style.borderLeftColor = isWarning ? '#e63946' : '#f7d117';
            }

            function injureNeymar(reason = 'chute forte') {
                if (neymarInjured) return;
                neymarInjured = true;
                injuries++;
                walkerAvailable = true;

                neymar.style.background = '#b0a070';
                neymar.style.filter = 'grayscale(0.6)';
                neymar.style.borderColor = '#aaa';

                if (!fragileBadge) {
                    fragileBadge = document.createElement('div');
                    fragileBadge.className = 'fragile-badge';
                    fragileBadge.textContent = '⚠️ PRODUTO FRÁGIL ⚠️';
                    neymar.appendChild(fragileBadge);
                }

                ballVelocity = { x: 0, y: 0 };
                ballMoving = false;

                updateStatus();
                setMessage(`😱 Neymar se lesionou! (${reason}) Ative o ANDADOR para continuar.`, true);
            }

            function resetGame() {
                neymarPos = { x: 100, y: 220 };
                raphinhaPos = { x: 650, y: 220 };
                ballPos = { x: 120, y: 240 };
                ballVelocity = { x: 0, y: 0 };
                ballMoving = false;
                goalCooldown = false;
                shootCooldown = false;

                score = 0;
                injuries = 0;
                oilCount = 0;
                neymarInjured = false;
                usingWalker = false;
                walkerAvailable = false;

                neymar.style.background = '#f7d117';
                neymar.style.filter = 'none';
                neymar.style.borderColor = '#fff3b0';
                neymar.style.transform = 'none';

                if (fragileBadge && fragileBadge.parentNode) {
                    fragileBadge.remove();
                    fragileBadge = null;
                }

                // Reset das teclas
                keys.up = keys.down = keys.left = keys.right = keys.space = false;

                updateStatus();
                updatePositions();
                setMessage('Jogo reiniciado! Mova com <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> e chute com <span class="key-hint">ESPAÇO</span>.');
            }

            function applyOil() {
                oilCount++;
                setMessage(`🧴 Raphinha passou body splash da Virgínia e óleo corporal! Campo escorregadio...`, false);
                oilSpan.textContent = `ÓLEO: ${oilCount}`;

                field.style.transition = 'filter 0.2s';
                field.style.filter = 'brightness(1.3) saturate(1.5)';
                setTimeout(() => { field.style.filter = 'none'; }, 300);
            }

            function tryShoot() {
                if (shootCooldown) return;
                if (neymarInjured && !usingWalker) {
                    setMessage('Neymar lesionado! Ative o ANDADOR para jogar.', true);
                    return;
                }

                const dx = (neymarPos.x + PLAYER_W/2) - (ballPos.x + BALL_SIZE/2);
                const dy = (neymarPos.y + PLAYER_H/2) - (ballPos.y + BALL_SIZE/2);
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > 60) {
                    setMessage('Muito longe da bola! Aproxime-se para chutar.', false);
                    return;
                }

                // Cooldown do chute (300ms)
                shootCooldown = true;
                setTimeout(() => { shootCooldown = false; }, 300);

                // Chance de lesão
                if (!neymarInjured) {
                    let injuryChance = 0.25 + (oilCount * 0.1);
                    injuryChance = Math.min(injuryChance, 0.85);
                    if (Math.random() < injuryChance) {
                        injureNeymar('chute escorregadio');
                    }
                }

                // Chuta a bola para a direita
                const power = 10;
                ballVelocity.x = power;
                ballVelocity.y = (Math.random() - 0.5) * 4;
                ballMoving = true;

                setMessage('⚡ Chutou! A bola está indo para o gol...', false);
            }

            function checkGoal() {
                if (ballPos.x + BALL_SIZE > FIELD_W - 20 && ballPos.x < FIELD_W + 20) {
                    if (!goalCooldown) {
                        score++;
                        updateStatus();
                        setMessage(`⚽ GOOOOL! Neymar marcou! Total: ${score}`, false);
                        ballPos = { x: 400, y: 240 };
                        ballVelocity = { x: 0, y: 0 };
                        ballMoving = false;
                        goalCooldown = true;
                        setTimeout(() => { goalCooldown = false; }, 800);
                    }
                }

                if (ballPos.x < -20 || ballPos.x > FIELD_W + 20 || ballPos.y < -20 || ballPos.y > FIELD_H + 20) {
                    ballPos = { x: 400, y: 240 };
                    ballVelocity = { x: 0, y: 0 };
                    ballMoving = false;
                    setMessage('Bola saiu! Reiniciando no meio.', false);
                }
            }

            function moveNeymar() {
                // Velocidade: normal ou lenta com andador
                const speed = usingWalker ? 1.8 : 5;

                let dx = 0, dy = 0;
                if (keys.up) dy -= 1;
                if (keys.down) dy += 1;
                if (keys.left) dx -= 1;
                if (keys.right) dx += 1;

                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx*dx + dy*dy);
                    dx = (dx / len) * speed;
                    dy = (dy / len) * speed;

                    neymarPos.x = clamp(neymarPos.x + dx, 0, FIELD_W - PLAYER_W);
                    neymarPos.y = clamp(neymarPos.y + dy, 0, FIELD_H - PLAYER_H);

                    if (usingWalker) {
                        neymar.style.transform = 'rotate(3deg)';
                    } else {
                        neymar.style.transform = 'none';
                    }
                } else {
                    neymar.style.transform = 'none';
                }
            }

            function moveBall() {
                if (!ballMoving) return;

                ballPos.x += ballVelocity.x;
                ballPos.y += ballVelocity.y;

                ballVelocity.x *= 0.985;
                ballVelocity.y *= 0.985;

                if (Math.abs(ballVelocity.x) < 0.1 && Math.abs(ballVelocity.y) < 0.1) {
                    ballVelocity = { x: 0, y: 0 };
                    ballMoving = false;
                }

                if (ballPos.y < 0) {
                    ballPos.y = 0;
                    ballVelocity.y *= -0.7;
                } else if (ballPos.y > FIELD_H - BALL_SIZE) {
                    ballPos.y = FIELD_H - BALL_SIZE;
                    ballVelocity.y *= -0.7;
                }

                checkGoal();

                if (ballPos.x < -10) {
                    ballPos = { x: 400, y: 240 };
                    ballVelocity = { x: 0, y: 0 };
                    ballMoving = false;
                }
            }

            function randomEvents() {
                if (Math.random() < 0.005) {
                    applyOil();
                }
            }

            function toggleWalker() {
                if (!walkerAvailable || usingWalker) return;
                usingWalker = true;
                setMessage('🦯 Neymar está usando o andador! Velocidade reduzida, mas ele continua no jogo.', false);
                neymar.style.background = '#b8a97a';
                updateStatus();
            }

            // ===== LOOP PRINCIPAL =====
            function gameLoop(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const dt = Math.min(100, timestamp - lastTimestamp) / 16.67;
                lastTimestamp = timestamp;

                // Movimento (apenas se não estiver lesionado ou se estiver com andador)
                if (!neymarInjured || usingWalker) {
                    moveNeymar();
                }

                moveBall();
                updatePositions();

                // Eventos aleatórios
                randomEvents();

                // Dica de proximidade
                if ((!neymarInjured || usingWalker) && !ballMoving) {
                    const dx = (neymarPos.x + PLAYER_W/2) - (ballPos.x + BALL_SIZE/2);
                    const dy = (neymarPos.y + PLAYER_H/2) - (ballPos.y + BALL_SIZE/2);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 55) {
                        setMessage('Pressione <span class="key-hint">ESPAÇO</span> para chutar!', false);
                    }
                }

                raphinha.style.boxShadow = '0 0 20px #aaffaa, 0 8px 0 rgba(0,0,0,0.3)';

                requestAnimationFrame(gameLoop);
            }

            // ===== CONTROLES DE TECLADO =====
            const keyMap = {
                'w': 'up', 'W': 'up', 'ArrowUp': 'up',
                's': 'down', 'S': 'down', 'ArrowDown': 'down',
                'a': 'left', 'A': 'left', 'ArrowLeft': 'left',
                'd': 'right', 'D': 'right', 'ArrowRight': 'right',
                ' ': 'space', 'Space': 'space', 'Spacebar': 'space'
            };

            window.addEventListener('keydown', (e) => {
                const mapped = keyMap[e.key];
                if (!mapped) return;

                e.preventDefault();

                if (mapped === 'space') {
                    // Evita repetição muito rápida
                    if (!keys.space) {
                        keys.space = true;
                        tryShoot();
                    }
                } else {
                    keys[mapped] = true;
                }
            });

            window.addEventListener('keyup', (e) => {
                const mapped = keyMap[e.key];
                if (!mapped) return;
                e.preventDefault();

                if (mapped === 'space') {
                    keys.space = false;
                } else {
                    keys[mapped] = false;
                }
            });

            // Previne rolagem com setas/espaço
            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
            }, { passive: false });

            // ===== BOTÕES =====
            walkerBtn.addEventListener('click', toggleWalker);

            resetBtn.addEventListener('click', () => {
                resetGame();
            });

            shootBtn.addEventListener('click', () => {
                tryShoot();
            });

            // D-pad virtual (mobile)
            document.querySelectorAll('.dpad button[data-key]').forEach(btn => {
                const key = btn.dataset.key;
                const mapped = keyMap[key] || keyMap[key.toUpperCase()];
                if (!mapped) return;

                const press = (e) => {
                    e.preventDefault();
                    if (mapped === 'space') {
                        if (!keys.space) {
                            keys.space = true;
                            tryShoot();
                        }
                    } else {
                        keys[mapped] = true;
                    }
                };
                const release = (e) => {
                    e.preventDefault();
                    if (mapped === 'space') {
                        keys.space = false;
                    } else {
                        keys[mapped] = false;
                    }
                };

                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release);
                btn.addEventListener('touchstart', press, { passive: false });
                btn.addEventListener('touchend', release);
                btn.addEventListener('touchcancel', release);
            });

            // ===== INICIALIZAÇÃO =====
            function init() {
                resetGame();
                updatePositions();
                requestAnimationFrame(gameLoop);
            }

            init();

        })();
    </script>
</body>
</html>
