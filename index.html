<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Aberto 3D - Primeira Pessoa</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.8;
            background: rgba(0,0,0,0.5);
            padding: 12px 18px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        #hud .label { color: #8899aa; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        #hud .value { color: #4fc3f7; font-weight: bold; }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 10px 24px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
            white-space: nowrap;
            z-index: 10;
        }
        #controls .key {
            color: #4fc3f7;
            font-weight: bold;
            background: rgba(79,195,247,0.1);
            padding: 2px 10px;
            border-radius: 4px;
            margin: 0 2px;
            border: 1px solid rgba(79,195,247,0.2);
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.5);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            top: -10px;
            left: -1px;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            top: -1px;
            left: -10px;
        }
        #crosshair .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            top: -1.5px;
            left: -1.5px;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        #loading .title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #4fc3f7, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loading .subtitle {
            font-size: 14px;
            color: #8899aa;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        #loading .bar {
            width: 300px;
            height: 3px;
            background: #1a1a2e;
            margin-top: 30px;
            border-radius: 2px;
            overflow: hidden;
        }
        #loading .bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4fc3f7, #ff6b35);
            animation: loadProgress 2s ease-in-out forwards;
        }
        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        #notify {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 10px 24px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        #notify.show { opacity: 1; }
        
        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            text-align: right;
            pointer-events: none;
            z-index: 10;
            line-height: 1.6;
        }
        
        @media (max-width: 600px) {
            #controls { font-size: 10px; padding: 8px 12px; white-space: normal; width: 90%; }
            #hud { font-size: 12px; padding: 8px 12px; }
            #info { display: none; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="title">🌆 CIDADE ABERTA</div>
        <div class="subtitle">Carregando mundo em primeira pessoa...</div>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div id="hud">
        <div><span class="label">📍 POSIÇÃO</span><br><span class="value" id="pos">0, 0</span></div>
        <div><span class="label">🏃 STATUS</span><br><span class="value" id="status">Parado</span></div>
        <div><span class="label">🎯 VISÃO</span><br><span class="value" id="direction">Norte</span></div>
    </div>

    <div id="crosshair"><div class="dot"></div></div>
    <div id="notify">🎮 Clique na tela para travar o mouse</div>
    <div id="info">FPS: <span id="fps">0</span></div>
    <div id="controls">
        <span class="key">W A S D</span> Mover • 
        <span class="key">Mouse</span> Olhar • 
        <span class="key">Espaço</span> Pular • 
        <span class="key">Shift</span> Correr
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================
        // CENA E CONFIGURAÇÕES
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 80, 200);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ 
            antialiasing: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ============================================
        // ILUMINAÇÃO REALISTA
        // ============================================
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x362d1e, 0.6);
        scene.add(hemisphereLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-30, 20, -30);
        scene.add(fillLight);

        // ============================================
        // CHÃO E RUAS
        // ============================================
        const groundGeometry = new THREE.PlaneGeometry(500, 500, 1, 1);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a3a,
            roughness: 0.9,
            metalness: 0.1,
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        const roadMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a3a4a,
            roughness: 0.8,
            metalness: 0.05,
        });

        for (let i = -12; i <= 12; i++) {
            const roadH = new THREE.Mesh(new THREE.PlaneGeometry(500, 4), roadMaterial);
            roadH.rotation.x = -Math.PI / 2;
            roadH.position.set(0, 0.01, i * 20);
            roadH.receiveShadow = true;
            scene.add(roadH);

            const roadV = new THREE.Mesh(new THREE.PlaneGeometry(4, 500), roadMaterial);
            roadV.rotation.x = -Math.PI / 2;
            roadV.position.set(i * 20, 0.01, 0);
            roadV.receiveShadow = true;
            scene.add(roadV);
        }

        // ============================================
        // GERADOR DE PRÉDIOS
        // ============================================
        function createBuilding(x, z, w, d, h, color) {
            const group = new THREE.Group();
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.6,
                metalness: 0.2,
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            body.position.y = h/2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            if (w > 2 && d > 2 && h > 3) {
                const windowMat = new THREE.MeshStandardMaterial({
                    color: 0x88ccff,
                    emissive: new THREE.Color(0x224466),
                    emissiveIntensity: 0.15,
                    roughness: 0.1,
                    metalness: 0.8,
                });
                
                const cols = Math.min(Math.floor(w / 1.8), 4);
                const rows = Math.min(Math.floor(d / 1.8), 4);
                const floors = Math.min(Math.floor(h / 2.5), 6);
                
                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        for (let k = 0; k < floors; k++) {
                            const win = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.5), windowMat);
                            const offsetX = (i / (cols-1 || 1) - 0.5) * (w - 0.8);
                            const offsetZ = (j / (rows-1 || 1) - 0.5) * (d - 0.8);
                            const offsetY = (k / (floors-1 || 1) - 0.5) * (h - 1.2) + 0.5;
                            
                            if (i % 2 === 0) {
                                win.position.set(w/2 + 0.05, offsetY + 0.5, offsetZ);
                                win.rotation.y = Math.PI/2;
                            } else {
                                win.position.set(-w/2 - 0.05, offsetY + 0.5, offsetZ);
                                win.rotation.y = -Math.PI/2;
                            }
                            group.add(win);
                        }
                    }
                }
                
                for (let i = 0; i < Math.min(cols, 3); i++) {
                    for (let k = 0; k < Math.min(floors, 5); k++) {
                        const win = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.5), windowMat);
                        const offsetX = (i / (Math.min(cols, 3)-1 || 1) - 0.5) * (w - 0.8);
                        const offsetY = (k / (Math.min(floors, 5)-1 || 1) - 0.5) * (h - 1.2) + 0.5;
                        win.position.set(offsetX, offsetY + 0.5, d/2 + 0.05);
                        group.add(win);
                        
                        const win2 = win.clone();
                        win2.position.set(offsetX, offsetY + 0.5, -d/2 - 0.05);
                        win2.rotation.y = Math.PI;
                        group.add(win2);
                    }
                }
            }

            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        const buildingColors = [
            0x4a6a8a, 0x6a8a7a, 0x8a7a6a, 0x5a6a7a, 
            0x7a8a9a, 0x9a8a7a, 0x6a7a8a, 0x8a7a7a,
            0x3a5a7a, 0x7a6a5a, 0x5a7a6a, 0x6a5a7a,
            0x4a7a8a, 0x8a6a5a
        ];

        for (let i = -10; i <= 10; i++) {
            for (let j = -10; j <= 10; j++) {
                if (Math.abs(i) <= 1 && Math.abs(j) <= 1) continue;
                if (Math.random() > 0.15) {
                    const w = 2.5 + Math.random() * 3.5;
                    const d = 2.5 + Math.random() * 3.5;
                    const h = 3 + Math.random() * 12;
                    const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                    const x = i * 22 + (Math.random() - 0.5) * 2;
                    const z = j * 22 + (Math.random() - 0.5) * 2;
                    createBuilding(x, z, w, d, h, color);
                }
            }
        }

        for (let k = 0; k < 20; k++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 25 + Math.random() * 30;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const h = 15 + Math.random() * 20;
            const color = 0x4a6a8a;
            createBuilding(x, z, 4, 4, h, color);
        }

        // ============================================
        // ÁRVORES
        // ============================================
        function createTree(x, z) {
            const group = new THREE.Group();
            
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.5, 6), trunkMat);
            trunk.position.y = 1.25;
            trunk.castShadow = true;
            group.add(trunk);
            
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: 0x2d5a27, 
                roughness: 0.8,
                emissive: new THREE.Color(0x1a3a14),
                emissiveIntensity: 0.05,
            });
            
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(1.2, 6, 6), leafMat);
            leaf1.position.set(0, 3.5, 0);
            leaf1.castShadow = true;
            group.add(leaf1);
            
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 6, 6), leafMat);
            leaf2.position.set(0.8, 4.2, 0.5);
            leaf2.castShadow = true;
            group.add(leaf2);
            
            const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 6, 6), leafMat);
            leaf3.position.set(-0.7, 4.0, -0.6);
            leaf3.castShadow = true;
            group.add(leaf3);
            
            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        for (let i = -10; i <= 10; i++) {
            for (let j = -10; j <= 10; j++) {
                if (Math.abs(i) <= 1 && Math.abs(j) <= 1) continue;
                if (Math.random() > 0.88) {
                    const x = i * 22 + (Math.random() - 0.5) * 5;
                    const z = j * 22 + (Math.random() - 0.5) * 5;
                    if (!(Math.abs(x) < 5 && Math.abs(z) < 5)) {
                        createTree(x, z);
                    }
                }
            }
        }

        // ============================================
        // CARROS ESTACIONADOS
        // ============================================
        function createCar(x, z, color, rotation = 0) {
            const group = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: 0.3, 
                metalness: 0.6 
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.4, 1.2), bodyMat);
            body.position.y = 0.2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            
            const cabinMat = new THREE.MeshStandardMaterial({ 
                color: 0x88ccff, 
                roughness: 0.1, 
                metalness: 0.3,
                transparent: true,
                opacity: 0.5,
            });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 1.0), cabinMat);
            cabin.position.set(0, 0.5, 0);
            cabin.castShadow = true;
            group.add(cabin);
            
            const lightMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffaa, 
                emissive: 0xffaa44, 
                emissiveIntensity: 0.2 
            });
            const f1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), lightMat);
            f1.position.set(0.5, 0.15, -0.6);
            group.add(f1);
            const f2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), lightMat);
            f2.position.set(-0.5, 0.15, -0.6);
            group.add(f2);
            
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const wheelPos = [
                [-0.7, 0.08, -0.6],
                [0.7, 0.08, -0.6],
                [-0.7, 0.08, 0.6],
                [0.7, 0.08, 0.6]
            ];
            for (const pos of wheelPos) {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 8), wheelMat);
                wheel.rotation.z = Math.PI/2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                group.add(wheel);
            }
            
            group.position.set(x, 0.05, z);
            group.rotation.y = rotation;
            scene.add(group);
            return group;
        }

        const carColors = [0xff1744, 0x2979ff, 0x00e676, 0xffea00, 0xd500f9, 0xff9100, 0x00bcd4, 0xff4081];
        for (let i = 0; i < 30; i++) {
            let x, z, valid;
            let attempts = 0;
            do {
                x = (Math.random() - 0.5) * 440;
                z = (Math.random() - 0.5) * 440;
                valid = Math.abs(x) > 5 || Math.abs(z) > 5;
                attempts++;
            } while (!valid && attempts < 30);
            
            if (valid) {
                const color = carColors[Math.floor(Math.random() * carColors.length)];
                createCar(x, z, color, Math.random() * Math.PI * 2);
            }
        }

        // ============================================
        // CONTROLES DE PRIMEIRA PESSOA (MANUAL)
        // ============================================
        let isLocked = false;
        let pitch = 0;
        let yaw = 0;
        const mouseSensitivity = 0.002;

        // Posição do jogador
        const playerPos = new THREE.Vector3(0, 1.7, 0);
        camera.position.copy(playerPos);

        // Eventos de mouse para controlar a câmera
        document.addEventListener('mousemove', (event) => {
            if (!isLocked) return;
            
            const movementX = event.movementX || 0;
            const movementY = event.movementY || 0;
            
            yaw -= movementX * mouseSensitivity;
            pitch -= movementY * mouseSensitivity;
            pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
            
            // Aplicar rotação à câmera
            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        });

        // Pointer Lock API
        renderer.domElement.addEventListener('click', () => {
            if (!isLocked) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
            
            if (isLocked) {
                document.getElementById('notify').textContent = '🎮 Mouse travado! Use WASD para andar';
                document.getElementById('notify').classList.add('show');
                setTimeout(() => document.getElementById('notify').classList.remove('show'), 2000);
            } else {
                document.getElementById('notify').textContent = '🔓 Mouse destravado! Clique para travar';
                document.getElementById('notify').classList.add('show');
                setTimeout(() => document.getElementById('notify').classList.remove('show'), 2000);
            }
        });

        // ============================================
        // FÍSICA E MOVIMENTO
        // ============================================
        const keys = {};
        let velocityY = 0;
        let isOnGround = true;
        let isRunning = false;
        const gravity = -30;
        const jumpSpeed = 9;
        const walkSpeed = 5;
        const runSpeed = 9;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') { e.preventDefault(); }
            if (e.key === 'Shift') { isRunning = true; }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === 'Shift') { isRunning = false; }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') e.preventDefault();
        }, false);

        // ============================================
        // LOOP PRINCIPAL
        // ============================================
        const clock = new THREE.Clock();
        let frameCount = 0;
        let fpsCounter = 0;

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            frameCount++;
            
            // FPS
            fpsCounter++;
            if (frameCount % 30 === 0) {
                document.getElementById('fps').textContent = Math.round(fpsCounter / 0.5);
                fpsCounter = 0;
            }

            if (isLocked) {
                const speed = isRunning ? runSpeed : walkSpeed;
                
                // Direções baseadas na câmera
                const forward = new THREE.Vector3(0, 0, -1);
                forward.applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3(1, 0, 0);
                right.applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                const move = new THREE.Vector3(0, 0, 0);
                if (keys['w']) move.add(forward);
                if (keys['s']) move.sub(forward);
                if (keys['a']) move.sub(right);
                if (keys['d']) move.add(right);

                let moving = false;
                if (move.length() > 0) {
                    move.normalize().multiplyScalar(speed * delta * 15);
                    playerPos.x += move.x;
                    playerPos.z += move.z;
                    moving = true;
                }

                // Pulo
                if (keys[' '] && isOnGround) {
                    velocityY = jumpSpeed;
                    isOnGround = false;
                }

                // Gravidade
                velocityY += gravity * delta;
                playerPos.y += velocityY * delta;
                if (playerPos.y <= 1.7) {
                    playerPos.y = 1.7;
                    velocityY = 0;
                    isOnGround = true;
                }

                // Atualizar câmera
                camera.position.copy(playerPos);

                // Atualizar HUD
                document.getElementById('pos').textContent = `${Math.round(playerPos.x)}, ${Math.round(playerPos.z)}`;
                document.getElementById('status').textContent = moving ? (isRunning ? '🏃 Correndo' : '🚶 Andando') : '⏸ Parado';
                
                // Direção (Norte, Sul, Leste, Oeste)
                const angle = yaw * (180 / Math.PI);
                let dir = 'Norte';
                if (angle > -45 && angle <= 45) dir = 'Norte';
                else if (angle > 45 && angle <= 135) dir = 'Leste';
                else if (angle > -135 && angle <= -45) dir = 'Oeste';
                else dir = 'Sul';
                document.getElementById('direction').textContent = dir;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ============================================
        // RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // INICIAR
        // ============================================
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 2500);

        setTimeout(() => {
            const notify = document.getElementById('notify');
            notify.textContent = '🎮 Clique na tela para travar o mouse e começar!';
            notify.classList.add('show');
            setTimeout(() => notify.classList.remove('show'), 4000);
        }, 3000);

        animate();

        console.log('🎮 Mundo Aberto em Primeira Pessoa - CORRIGIDO');
        console.log('📋 WASD - Mover | Mouse - Olhar | Espaço - Pular | Shift - Correr');
        console.log('🖱️ Clique na tela para travar o mouse');
        console.log('✅ W agora funciona corretamente para frente!');
    </script>
</body>
</html>
